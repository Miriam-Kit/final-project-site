<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Final Files</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Akaya+Kanadaka&family=Amarante&family=Mali&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Everything lives inside this box so the page stays centered with space on the sides -->
  <div class="site">

  <!-- Banner at the top of the page -->
  <header class="hero">
    <img class="hero-texture hero-texture-strong" src="images/final-files-rectangle-4.png" alt="">
    <h1 class="hero-title">Final Files</h1>
  </header>

  <div class="page">

    <!-- Side navigation: icons show by default, names slide out on hover -->
    <nav class="nav-drawer">
      <p class="nav-title">Navigation</p>
      <ul class="nav-list">
        <li class="nav-item">
          <a class="nav-link" href="index.html">
            <img class="nav-icon" src="images/image-10.png" alt="Home">
            Home
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="research.html">
            <img class="nav-icon" src="images/image-11.png" alt="Research">
            Research
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="sketches.html">
            <img class="nav-icon" src="images/image-12.png" alt="Sketches">
            Sketches
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="finalfiles.html">
            <img class="nav-icon" src="images/image-13.png" alt="Final Files and Mockups">
            Final Files &amp; Mockups
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="citations.html">
            <img class="nav-icon" src="images/people-icon.png" alt="Citations">
            Citations
          </a>
        </li>
      </ul>
    </nav>

    <main class="page-content">

      <article class="final-box">

        <!-- Left column: the final logo and the color pallet -->
        <section class="final-left">
          <h2 class="sub-title final-heading">Final logo</h2>
          <button class="expand-button final-logo" popovertarget="final-logo-big">
            <img class="expand-thumb" src="images/final-logo.png" alt="Final Boswell Book Company logo">
            <span class="expand-label">Expand</span>
          </button>
          <div class="enlarged-box" id="final-logo-big" popover>
            <img class="enlarged-image" src="images/final-logo.png" alt="Final Boswell Book Company logo, enlarged">
          </div>

          <h2 class="sub-title palette-heading">Color pallet</h2>
          <ul class="swatch-list">
            <li class="swatch swatch-black"></li>
            <li class="swatch swatch-dark-brown"></li>
            <li class="swatch swatch-tan"></li>
            <li class="swatch swatch-orange"></li>
            <li class="swatch swatch-cream"></li>
            <li class="swatch swatch-navy"></li>
          </ul>
        </section>

        <!-- Right column: three mockups stacked -->
        <section class="final-right">
          <h2 class="sub-title final-heading">Mockups</h2>

          <button class="expand-button mockup-button" popovertarget="hanging-sign-big">
            <img class="expand-thumb" src="images/hanging-wall-sign-mockup-3-1.png" alt="Hanging wall sign mockup">
            <span class="expand-label">Expand</span>
          </button>
          <div class="enlarged-box" id="hanging-sign-big" popover>
            <img class="enlarged-image" src="images/hanging-wall-sign-mockup-3-1.png" alt="Hanging wall sign mockup, enlarged">
          </div>

          <button class="expand-button mockup-button" popovertarget="stamp-big">
            <img class="expand-thumb" src="images/rubber-stamp-mockup-1.png" alt="Rubber stamp mockup">
            <span class="expand-label">Expand</span>
          </button>
          <div class="enlarged-box" id="stamp-big" popover>
            <img class="enlarged-image" src="images/rubber-stamp-mockup-1.png" alt="Rubber stamp mockup, enlarged">
          </div>

          <button class="expand-button mockup-button" popovertarget="window-big">
            <img class="expand-thumb" src="images/window-signage-mock-up-1.png" alt="Window signage mockup">
            <span class="expand-label">Expand</span>
          </button>
          <div class="enlarged-box" id="window-big" popover>
            <img class="enlarged-image" src="images/window-signage-mock-up-1.png" alt="Window signage mockup, enlarged">
          </div>
        </section>

      </article>

      <a class="pill-button back-button" href="sketches.html">&lt; Back</a>

    </main>
  </div>

  </div>

</body>
</html>
